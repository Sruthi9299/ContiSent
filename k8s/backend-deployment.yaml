apiVersion: apps/v1
kind: Deployment
metadata:
  name: contisent-backend
  labels:
    app: contisent-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contisent-backend
  template:
    metadata:
      labels:
        app: contisent-backend
    spec:
      hostPID: true # Required for kube-bench to inspect node processes
      containers:
      - name: contisent-backend
        image: contisent-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: SQLALCHEMY_DATABASE_URI
          value: "sqlite:///./data/container_security.db"
        - name: SECRET_KEY
          value: "oracle-cloud-super-secret-key-change-me-later"
        - name: ALLOWED_ORIGINS
          value: '["*"]'
        volumeMounts:
        - name: host-etc
          mountPath: /etc
          readOnly: true
        - name: host-var
          mountPath: /var
          readOnly: true
      volumes:
      - name: host-etc
        hostPath:
          path: /etc
      - name: host-var
        hostPath:
          path: /var
---
apiVersion: v1
kind: Service
metadata:
  name: contisent-backend-service
spec:
  type: NodePort
  selector:
    app: contisent-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
