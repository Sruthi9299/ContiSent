apiVersion: apps/v1
kind: Deployment
metadata:
  name: contisent-frontend
  labels:
    app: contisent-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contisent-frontend
  template:
    metadata:
      labels:
        app: contisent-frontend
    spec:
      containers:
      - name: contisent-frontend
        image: contisent-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://localhost:30080"
---
apiVersion: v1
kind: Service
metadata:
  name: contisent-frontend-service
spec:
  type: NodePort
  selector:
    app: contisent-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
