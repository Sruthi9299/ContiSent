apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-d648ba304b73
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-d648ba304b73
  template:
    metadata:
      labels:
        app: app-d648ba304b73
    spec:
      containers:
      - image: nginxinc/nginx-unprivileged:alpine
        name: web
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: app-d648ba304b73-svc
  namespace: default
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: app-d648ba304b73
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-d648ba304b73-deny-all
  namespace: default
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  podSelector: {}
  policyTypes:
  - Ingress
