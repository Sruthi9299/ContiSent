services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contisent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://postgres:password@db:5432/contisent
      - SECRET_KEY=mysecretkey123456789012345678901234567890
      - VERIFY_SSL_CERTS=true
      - USE_CELERY=true
      - CELERY_BROKER_URL=redis://message_broker:6379/0
      - CELERY_RESULT_BACKEND=redis://message_broker:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/deployments:/app/generated_deployments
      - ~/.kube:/home/appuser/.kube:ro
      - ~/.minikube:/home/appuser/.minikube:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
  message_broker:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      
  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
      - message_broker
    env_file:
      - ./backend/.env
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://postgres:password@db:5432/contisent
      - SECRET_KEY=mysecretkey123456789012345678901234567890
      - CELERY_BROKER_URL=redis://message_broker:6379/0
      - CELERY_RESULT_BACKEND=redis://message_broker:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/deployments:/app/generated_deployments
      - ~/.kube:/home/appuser/.kube:ro
      - ~/.minikube:/home/appuser/.minikube:ro
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}

volumes:
  postgres_data:
